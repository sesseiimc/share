<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>專屬好康跳轉中...</title>
  <style>
    :root { --theme-color: #6B2D3C; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8F9FA;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      max-width: 360px;
      width: 100%;
      overflow: hidden;
      text-align: center;
      padding: 40px 20px;
    }
    .spinner {
      border: 3px solid rgba(0,0,0,0.1); width: 40px; height: 40px;
      border-radius: 50%; border-left-color: var(--theme-color);
      animation: spin 1s linear infinite; margin: 0 auto 16px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn-manual {
      display: inline-block; margin-top: 16px; padding: 10px 20px;
      background: var(--theme-color); color: #fff; text-decoration: none;
      border-radius: 8px; font-size: 14px; font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h3 style="color: #2D3748; font-size: 16px; margin-bottom: 8px;">正在為您開啟專屬好禮...</h3>
    <p style="color: #718096; font-size: 13px;">即將自動前往 LINE 官方帳號</p>
    <a id="fallbackBtn" class="btn-manual" style="display: none;" href="#">點此直接進入 LINE</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let botId = urlParams.get("bot") || "";
    const sourceTag = urlParams.get("src") || "";

    // 自動補上 @ 符號防呆
    if (botId && !botId.startsWith("@")) {
      botId = "@" + botId;
    }

    if (botId) {
      const targetUrl = `https://line.me/R/oaMessage/${encodeURIComponent(botId)}/?${encodeURIComponent(sourceTag)}`;
      
      // 立即自動喚醒 LINE App
      window.location.href = targetUrl;

      // 防呆：若手機瀏覽器攔截，顯示手動點擊按鈕
      setTimeout(() => {
        const btn = document.getElementById("fallbackBtn");
        btn.href = targetUrl;
        btn.style.display = "inline-block";
      }, 1500);
    } else {
      document.querySelector("h3").innerText = "⚠️ 連結缺少官方帳號參數";
      document.querySelector("p").innerText = "請確認推廣網址是否包含 ?bot=@帳號ID";
      document.querySelector(".spinner").style.display = "none";
    }
  </script>
</body>
</html>
